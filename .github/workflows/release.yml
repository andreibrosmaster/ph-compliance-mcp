# Release — publishes corpus assets + SHA-256 checksums to GitHub Releases.
# Checksums are load-bearing (blueprint §17): corpus-loader.ts refuses to load
# on mismatch. The checksum step is wired from Phase 0 (day one) so it can't be
# forgotten later.
#
# release-gates job runs the documented gates (docs/release.md) and is a hard
# prerequisite for publishing: a release that fails typecheck/lint/test/audit
# or regresses the golden eval set must not ship.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['corpus-*', 'v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:loc
      - run: pnpm audit --prod
      - run: pnpm build
      # The eval gate is only real if the corpus exists: run-eval auto-wires
      # dist/corpus when present and exits 2 (coverage-blocked) when absent.
      # Without this build step the gate passed vacuously on every release.
      # Seed-only build (no --sources): this gate verifies RETRIEVAL, not the
      # live ingestion path — that is refresh-corpus.yml's job.
      - name: Build seed corpus for the eval gate
        run: pnpm build:corpus -- --seed data/seed --out dist/corpus
      - name: Golden eval gate
        run: |
          set +e
          pnpm eval:all
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "eval gate passed"
          elif [ "$code" -eq 2 ]; then
            echo "::error::eval coverage-blocked — the seed corpus build above failed or is empty; this gate cannot pass vacuously"
            exit 2
          else
            echo "::error::golden eval regression — release-blocking"
            exit "$code"
          fi

  build-corpus:
    runs-on: ubuntu-latest
    needs: release-gates
    permissions:
      contents: write   # softprops/action-gh-release needs write access to publish assets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Build corpus with version stamp
        run: |
          mkdir -p dist/corpus
          # manifest stamp = plain YYYY.MM.DD (strip corpus- / v prefixes so a
          # corpus-2026.08.02 tag stamps 2026.08.02, matching defaultStamp()).
          STAMP="${GITHUB_REF_NAME#v}"
          STAMP="${STAMP#corpus-}"
          echo "using corpus stamp: ${STAMP}"
          # No error swallow: build-index exits 1 when --sources ingests zero
          # instruments (stale-corpus guard) or the build itself fails.
          pnpm build:corpus -- \
            --sources official-gazette,lawphil \
            --seed data/seed \
            --out dist/corpus \
            --stamp "${STAMP}"
      # A partial corpus published to Releases bricks every downstream server
      # start (corpus-loader downloads all three assets + manifest). Require
      # completeness instead of "at least one sqlite file exists".
      - name: Verify corpus completeness + checksums (wired from Phase 0)
        run: |
          set -euo pipefail
          cd dist/corpus
          for f in laws.sqlite cases.sqlite issuances.sqlite; do
            if [ ! -f "$f" ]; then
              echo "::error::corpus build is incomplete: $f is missing — refusing to publish"
              exit 1
            fi
            sha256sum "$f" > "$f.sha256"
            echo "$f: $(wc -c < "$f") bytes, sha256 $(awk '{print $1}' "$f.sha256")"
          done
          if [ ! -f manifest.json ]; then
            echo "::error::manifest.json missing — refusing to publish"
            exit 1
          fi
      - name: Publish release assets
        if: hashFiles('dist/corpus/*.sqlite') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/corpus/*.sqlite
            dist/corpus/*.sha256
            dist/corpus/manifest.json
